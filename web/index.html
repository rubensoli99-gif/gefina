<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <div></div>

    <script 
         crossorigin 
         src="https://unpkg.com/react@18/umd/react.development.js">
    </script>
    <script 
         crossorigin 
         src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>

    <script 
         crossorigin
         src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>

    <script 
        type="text/babel" 
         
        >

        const container = document.querySelector("div");

        const root = ReactDOM.createRoot(container);

        const invoices = [

            {
                id: 1,
                amount: 125037,
                status: 'pending',
                issueDate: '2026-10-03',
                dueDate: '2026-11-03',
                customer: {
                    id: 7,
                    name: 'Construtora Meridiano',
                    email: 'contato@meridiano.com'
                }
            },
            {
                id: 2,
                amount: 35000,
                status: 'paid',
                issueDate: '2026-10-02',
                dueDate: '2026-11-05',
                customer: {
                    id: 7,
                    name: 'Gráfica Nova',
                    email: 'contato@meridiano.com'
                }
            },
            {
                id: 3,
                amount: 250037,
                status: 'pending',
                issueDate: '2026-10-03',
                dueDate: '2026-11-03',
                customer: {
                    id: 7,
                    name: 'Tenditudo',
                    email: 'contato@meridiano.com'
                }
            },
    ];

           

        const InvoiceTitle = () => { 
            return <h1>Faturas</h1>;
        };

        const InvoiceRow = (props) => {
           
            return <tr>
                <td>{props.data.customer.name}</td>
                <td>{props.data.amount}</td>
                <td>{props.data.issueDate}</td>
                <td>{props.data.dueDate}</td>
                <td>{props.data.status === "paid" ? "pago" : "pendente"}</td>
            </tr>;
        }
         

        const InvoiceTable = () => {
            return <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Valor</th>
                            <th>Emissão</th>
                            <th>Vencimento</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <tbody>
                        {invoices.map( (invoice) => {return<InvoiceRow 
                            key= {invoice.id}
                             data={invoice} 
                             />;
                        })}
                    </tbody>
                </table>
        }

        const App = () => {
            return <>
                <InvoiceTitle  />
                <InvoiceTable   />
            
            </>;
        }
        
       root.render(<App/>);
    </script>
</body>
</html>
